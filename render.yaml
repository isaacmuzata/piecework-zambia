services:
  - type: web
    name: piecework-zambia
    runtime: docker
    # Verified live Nov 8, 2026 via the Render API (service
    # srv-das79rvavr4c739b01jg): plan "starter" (0.5c-512mb), region oregon.
    # The file previously said plan: free, which was stale: re-applying the
    # blueprint with plan: free would have downgraded the live service.
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      # generateValue mints the secret ONCE, when the Blueprint is first
      # applied. Render retains the current value for an existing service
      # and does NOT regenerate it on later Blueprint syncs, so re-applying
      # this file does not invalidate live sessions. (Verified against
      # Render's Blueprint reference, Nov 8, 2026.) If the service were
      # ever recreated from scratch, a NEW secret would be minted and every
      # live session would break: that is the recreate case, not the sync case.
      - key: JWT_SECRET
        generateValue: true
      # Turso cloud database (free tier). The free plan cannot attach a
      # persistent disk, so the SQLite file would be wiped on every restart —
      # the database lives in Turso instead. Set both values in the Render
      # dashboard: service → Environment → add them manually.
      # Create a free database at https://turso.tech, then copy:
      #   TURSO_DATABASE_URL = libsql://<your-db>-<org>.turso.io
      #   TURSO_AUTH_TOKEN   = the token from `turso db tokens create <your-db>`
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # - key: ALLOWED_ORIGINS
      #   value: https://your-custom-domain.com
